# Save this file as: .github/workflows/newsletter.yml  (in your repo)
name: Morning Brief

on:
  schedule:
    # 06:30 Irish time. Ireland is UTC in winter, UTC+1 in summer (DST),
    # so this single UTC cron will drift by an hour across the year.
    # 06:30 UTC = 06:30 GMT (winter) / 07:30 IST (summer).
    # If you want it locked to 06:30 local year-round, use two cron lines
    # (one for summer, one for winter) or accept the hour drift — simplest
    # is to just accept it, most people do.
    - cron: "30 6 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write   # needed so the job can commit seen_stories.json, the weekly digest history, and docs/ (the hosted page) back to the repo

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run newsletter script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python newsletter.py

      - name: Persist state and publish page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_stories.json weekly_history.json docs/
          git diff --cached --quiet || git commit -m "Update newsletter state and published page"
          git push
